<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <header>
      <nav>
        <h2>My Website</h2>

        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="contact.html">contact</a></li>
        </ul>

      </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <h1>Welcome to our Website</h1>
      <p>We build modern responsive websites</p>
      <button>Get Started</button>
    </section>
 
    <section class="games">

        <h2>Popular Games</h2>

        <div class="game-container">

            <div class="gams-card">
                <img src="ezio.jpg" alt="ezio auditore form assassin's creed">
                <h3>Ezio Auditore</h3>
        </div>

        <div class="game-card">
            <img src="pubg.jpg" alt="pubg battle game scene">
            <h3>PUBG</h3>
        </div>
        
        <div class="game-card">
            <img src="catalyst.jpg" alt="catalyst charset form apex legends">
            <h3>Catalyst</h3>
        </div>

    </div>
    <section class="contact">
        <h2>contact us</h2>

        <form>
            <input type="text" placeholder="Your Name"
            required>

            <input type="email" placeholder="Your Email"
            required>

            <textarea placeholder="Your Message" rows="5"
            required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>
    
    <footer class="footer">
        <p>2026 Gaming Website. All Rights Reserved</p>
    </footer>
</body>
</html>
